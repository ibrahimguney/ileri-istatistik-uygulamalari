name: Pages Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "surumler/22-bolum/**"
      - "bolumler/b*/README.md"
      - ".github/workflows/pages-smoke-test.yml"
  workflow_dispatch:

jobs:
  pages-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Canlı sitenin hazırlanmasını bekle
        run: sleep 20

      - name: Ana sayfayı doğrula
        run: |
          set -euo pipefail
          URL="https://ibrahimguney.github.io/ileri-istatistik-uygulamalari/"
          curl --fail --location --retry 6 --retry-delay 10 --retry-all-errors --max-time 30 "$URL" -o /tmp/index.html
          grep -F "İleri İstatistik Uygulamaları" /tmp/index.html
          grep -F "Çalışmak istediğiniz bölümü seçin" /tmp/index.html
          grep -F "İstatistiksel Düşünme: Sorudan Kanıta" /tmp/index.html
          grep -F "IBM SPSS Uygulamaları" /tmp/index.html

      - name: Örnek bölüm bağlantılarını doğrula
        run: |
          set -euo pipefail
          BASE="https://ibrahimguney.github.io/ileri-istatistik-uygulamalari"
          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 "$BASE/bolumler/b01/README.md" -o /tmp/b01.md
          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 "$BASE/bolumler/b06/README.md" -o /tmp/b06.md
          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 "$BASE/bolumler/b17/README.md" -o /tmp/b17.md
          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 "$BASE/bolumler/b18/README.md" -o /tmp/b18.md
          grep -F "İstatistiksel Düşünme: Sorudan Kanıta" /tmp/b01.md
          grep -F "Bölüm 6" /tmp/b06.md
          grep -F "Bölüm 17" /tmp/b17.md
          grep -F "Bölüm 18" /tmp/b18.md
          grep -F "IBM SPSS Uygulamaları" /tmp/b18.md

      - name: Stil dosyasını doğrula
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 --max-time 30 "https://ibrahimguney.github.io/ileri-istatistik-uygulamalari/assets/site.css" -o /tmp/site.css
          test -s /tmp/site.css


      - name: Güncel 22 bölümün doğrudan sayfalarını doğrula
        run: |
          set -euo pipefail
          BASE="https://ibrahimguney.github.io/ileri-istatistik-uygulamalari/surumler/22-bolum"
          for N in $(seq -w 1 22); do
            curl --fail --location --retry 6 --retry-delay 10 --retry-all-errors --max-time 30 "$BASE/bolumler/b$N/" -o "/tmp/current-b$N.html"
            grep -F "data-book-version=\"22-bolum\"" "/tmp/current-b$N.html"
            grep -F "data-chapter=\"b$N\"" "/tmp/current-b$N.html"
            if grep -Eqi 'http-equiv=["\x27]?refresh' "/tmp/current-b$N.html"; then
              echo "Beklenmeyen yönlendirme: b$N" >&2
              exit 1
            fi
          done
          curl --fail --location --retry 6 --retry-delay 10 --max-time 30 "$BASE/ogrenci-paketi-22-bolum.zip" -o /tmp/current22.zip
          unzip -t /tmp/current22.zip
