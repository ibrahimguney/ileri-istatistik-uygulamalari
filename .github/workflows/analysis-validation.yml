name: Full Analysis Validation

on:
  push:
    paths:
      - "bolumler/b*/analiz.py"
      - "bolumler/b*/beklenen.json"
      - "bolumler/b*/veri*.csv"
      - "bolumler/b*/requirements.txt"
      - "requirements.txt"
      - "tools/dogrula_analizler.py"
      - ".github/workflows/analysis-validation.yml"
  pull_request:
    paths:
      - "bolumler/b*/analiz.py"
      - "bolumler/b*/beklenen.json"
      - "bolumler/b*/veri*.csv"
      - "bolumler/b*/requirements.txt"
      - "requirements.txt"
      - "tools/dogrula_analizler.py"
      - ".github/workflows/analysis-validation.yml"
  workflow_dispatch:

jobs:
  full-analysis-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: B02-B17 analizlerini çalıştır ve beklenen değerlerle karşılaştır
        run: python tools/dogrula_analizler.py

      - name: İzlenen referans çıktılarında beklenmeyen fark oluşmadığını kontrol et
        run: |
          git status --short
          if ! git diff --quiet -- bolumler/*/sonuclar; then
            echo "Analizler sonuclar/ içindeki izlenen referans çıktıları değiştirdi."
            git diff -- bolumler/*/sonuclar
            exit 1
          fi
