name: Full Analysis Validation

on:
  push:
    paths:
      - "bolumler/b*/analiz.py"
      - "bolumler/b*/beklenen.json"
      - "bolumler/b*/veri*.csv"
      - "bolumler/b*/requirements.txt"
      - "requirements.txt"
      - "tools/dogrula_analizler.py"
      - ".github/workflows/analysis-validation.yml"
  pull_request:
    paths:
      - "bolumler/b*/analiz.py"
      - "bolumler/b*/beklenen.json"
      - "bolumler/b*/veri*.csv"
      - "bolumler/b*/requirements.txt"
      - "requirements.txt"
      - "tools/dogrula_analizler.py"
      - ".github/workflows/analysis-validation.yml"
  workflow_dispatch:

jobs:
  full-analysis-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: B01-B17 analizlerini çalıştır ve referans değerlerle anlamsal karşılaştır
        run: python tools/dogrula_analizler.py

      - name: Doğrulama sonrası çalışma ağacını raporla
        if: always()
        run: |
          echo "Not: sonuclar/ dosyalarında ortam veya kütüphane sürümüne bağlı yazımsal farklar oluşabilir."
          echo "Bilimsel doğrulamanın geçme/kalma ölçütü beklenen.json ile anlamsal ve toleranslı sayısal karşılaştırmadır."
          git status --short
